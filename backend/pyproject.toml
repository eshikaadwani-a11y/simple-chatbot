[project]
name = "learngraph-backend"
version = "1.0.0"
description = "Multi-agent AI learning platform backend (GPT-5 + LangGraph + FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
