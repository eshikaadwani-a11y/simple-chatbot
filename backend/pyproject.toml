[project]
name = "learngraph-backend"
version = "1.0.0"
description = "Multi-agent AI learning platform backend (GPT-5 + LangGraph + FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 is the standard FastAPI dependency-injection pattern (Depends() in defaults).
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
# Exclude bootstrapping/infra modules that require a live process or external
# services (DB/LLM) to execute; their logic is covered by integration in prod, not
# unit tests. This keeps the coverage gate meaningful for application logic.
omit = [
    "app/main.py",
    "app/observability.py",
    "app/memory/checkpointer.py",
    "app/db/supabase_client.py",
    "app/rag/ingest.py",
]
