[project]
name = "learngraph-backend"
version = "1.0.0"
description = "Multi-agent AI learning platform backend (GPT-5 + LangGraph + FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 is the standard FastAPI dependency-injection pattern (Depends() in defaults).
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/observability.py"]
